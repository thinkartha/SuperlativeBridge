AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SuperlativeBridge Backend API — Go Lambdas, Cognito authorizer, VPC to RDS

Parameters:
  Environment:
    Type: String
    Default: prod
  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional direct DSN. Prefer DatabaseUrlSecretArn in AWS.
  DatabaseUrlSecretArn:
    Type: String
    Default: ''
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Fallback HS256 secret for local / dual-auth mode.
  CognitoUserPoolArn:
    Type: String
    Default: ''
  CognitoUserPoolId:
    Type: String
    Default: ''
  CognitoUserPoolClientId:
    Type: String
    Default: ''
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
  LambdaSecurityGroupId:
    Type: String
    Default: ''
  LmsApiKey:
    Type: String
    NoEcho: true
    Default: ''
  IntegrationWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
  CorsAllowOrigin:
    Type: String
    Default: "'*'"

Conditions:
  UseVpc: !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]
  UseCognito: !Not [!Equals [!Ref CognitoUserPoolArn, '']]
  UseSecretArn: !Not [!Equals [!Ref DatabaseUrlSecretArn, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: provided.al2023
    Architectures: [arm64]
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        DATABASE_URL_SECRET_ARN: !Ref DatabaseUrlSecretArn
        JWT_SECRET: !Ref JwtSecret
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoUserPoolClientId
        LMS_API_KEY: !Ref LmsApiKey
        INTEGRATION_WEBHOOK_SECRET: !Ref IntegrationWebhookSecret
        ENVIRONMENT: !Ref Environment
    VpcConfig: !If
      - UseVpc
      - SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      - !Ref AWS::NoValue

Resources:
  LambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadDatabaseUrlSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !If
                  - UseSecretArn
                  - !Ref DatabaseUrlSecretArn
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:superlativebridge/*

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      Cors:
        AllowOrigin: !Ref CorsAllowOrigin
        AllowHeaders: "'Content-Type,Authorization,X-Api-Key,X-SB-Signature,X-SB-Timestamp,X-Request-Id'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      Auth: !If
        - UseCognito
        - DefaultAuthorizer: CognitoAuthorizer
          AddDefaultAuthorizerToCorsPreflight: false
          Authorizers:
            CognitoAuthorizer:
              UserPoolArn: !Ref CognitoUserPoolArn
        - !Ref AWS::NoValue

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/health/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

  CoursesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/courses/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/courses
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/courses/{id}
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/courses
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PUT"
            Method: /api/courses/{id}
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "DELETE"
            Method: /api/courses/{id}
  CategoriesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/categories/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/categories
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/categories
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PUT"
            Method: /api/categories/{id}
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "DELETE"
            Method: /api/categories/{id}
  MentorsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/mentors/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/mentors
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/mentors/{id}
        Analytics:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/mentors/{id}/analytics
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/mentors
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PUT"
            Method: /api/mentors/{id}
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "DELETE"
            Method: /api/mentors/{id}
  UsersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/users/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/users
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PUT"
            Method: /api/users/{id}
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "DELETE"
            Method: /api/users/{id}
        Enrollments:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}/enrollments
        Certifications:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}/certifications
        Notifications:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}/notifications
        Dashboard:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}/dashboard
        SavedCourses:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}/saved-courses
        MentorBookings:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}/mentor-bookings
        Analytics:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/users/{id}/analytics
  AuthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/auth/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        SignIn:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/auth/signin
            Method: POST
            Auth:
              Authorizer: NONE
        SignUp:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
        CognitoConfig:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/auth/cognito-config
            Method: GET
            Auth:
              Authorizer: NONE

  ProgramsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/programs/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/programs
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/programs/{id}
  VisaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/visa/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/visa-programs
  EnrollmentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/enrollments/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/enrollments
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PATCH"
            Method: /api/enrollments/{id}
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "DELETE"
            Method: /api/enrollments/{id}
        QuizAttempts:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/quiz-attempts
  IntegrationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/integrations/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/integrations
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/integrations/{id}
        Put:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PUT"
            Method: /api/integrations/{id}
        PutPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PUT"
            Method: /api/integrations/pipelines/{id}
        Run:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/integrations/pipelines/{id}/run
  SavedCoursesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/savedcourses/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/saved-courses
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "DELETE"
            Method: /api/saved-courses/{courseId}
  MentorBookingsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/mentorbookings/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/mentor-bookings
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PATCH"
            Method: /api/mentor-bookings/{id}
        Availability:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/mentors/{id}/availability
        Bookings:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/mentors/{id}/bookings
  EmployerAnalyticsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/employeranalytics/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Analytics:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/employer/analytics
        Export:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/employer/analytics/export
  MarketplaceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/marketplace/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/marketplace
  CommunityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/community/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/community
        Rsvp:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/community/events/{id}/rsvp
  EntrepreneurshipFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/entrepreneurship/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/entrepreneurship
  CandidatesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/candidates/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/candidates
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/candidates/{id}
  AdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/admin/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Stats:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/admin/stats
        AuditLog:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/admin/audit-log
        UserAnalytics:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/admin/user-analytics
        MentorAnalytics:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/admin/mentor-analytics
        Notifications:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/admin/notifications
        NotificationPatch:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PATCH"
            Method: /api/admin/notifications/{id}
  SettingsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/settings/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/settings
        Put:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "PUT"
            Method: /api/settings
  LmsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/lms/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Events:
        Providers:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/lms/providers
            Method: GET
            Auth:
              Authorizer: NONE
        Import:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/lms/courses/import
            Method: POST
            Auth:
              Authorizer: NONE
        Sync:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "POST"
            Method: /api/lms/providers/{provider}/sync
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/api/lms/webhooks/{provider}"
            Method: POST
            Auth:
              Authorizer: NONE
        Jobs:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "GET"
            Method: /api/lms/jobs
  MigrateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/migrate/
      Handler: bootstrap
      Role: !GetAtt LambdaFunctionRole.Arn
      Timeout: 120
      MemorySize: 512
      Description: Applies embedded SQL migrations against RDS (invoke from CI)

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  ApiId:
    Value: !Ref Api
  CognitoUserPoolIdOut:
    Value: !Ref CognitoUserPoolId
  EnvironmentOut:
    Value: !Ref Environment
  MigrateFunctionName:
    Description: Invoke after deploy to apply SQL migrations
    Value: !Ref MigrateFunction
