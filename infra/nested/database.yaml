AWSTemplateFormatVersion: '2010-09-09'
Description: SuperlativeBridge RDS Postgres (private) + Secrets Manager

Parameters:
  Environment:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: CommaDelimitedList
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DbInstanceClass:
    Type: String
  DbAllocatedStorage:
    Type: Number
  DbMasterUsername:
    Type: String
  DbName:
    Type: String

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub superlativebridge/${Environment}/rds
      Description: RDS master credentials
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SuperlativeBridge RDS Postgres
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub sb-${Environment}-rds-sg

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: SuperlativeBridge private subnets
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Name
          Value: !Sub sb-${Environment}-db-subnets

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub sb-${Environment}-postgres
      Engine: postgres
      EngineVersion: '16.4'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBName: !Ref DbName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '07:00-08:00'
      PreferredMaintenanceWindow: 'sun:08:00-sun:09:00'
      DeletionProtection: false
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Name
          Value: !Sub sb-${Environment}-rds

  # Host metadata only. Full DSN (with password) is written by scripts/deploy-infra.sh
  # after the stack is CREATE/UPDATE_COMPLETE — avoids a Custom Resource that
  # commonly DELETE_FAILS when its Lambda is already gone during rollback.
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DependsOn: DbInstance
    Properties:
      Name: !Sub superlativebridge/${Environment}/database-url
      Description: Full Postgres DSN (populated by deploy-infra.sh after RDS is ready)
      SecretString: !Sub
        - '{"dsn":"","host":"${Host}","port":"5432","dbname":"${Db}"}'
        - Host: !GetAtt DbInstance.Endpoint.Address
          Db: !Ref DbName

Outputs:
  DbEndpoint:
    Value: !GetAtt DbInstance.Endpoint.Address
  DbPort:
    Value: !GetAtt DbInstance.Endpoint.Port
  DbSecretArn:
    Value: !Ref DbSecret
  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret
  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
  DbInstanceId:
    Value: !Ref DbInstance
